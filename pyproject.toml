[project]
name = "litecms"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.3",
    "alibabacloud-oss-v2>=1.3.2",
    "argon2-cffi>=25.1.0",
    "beautifulsoup4>=4.15.0",
    "fastnanoid>=0.4.3",
    "jieba>=0.42.1",
    "jinja2-fragments>=1.12.0",
    "litestar-debug-toolbar>=0.4.2",
    "litestar[jinja,sqlalchemy,standard]>=2.24.0",
    "lxml>=6.1.1",
    "nh3>=0.3.6",
    "psutil>=7.2.2",
    "pillow>=11.0.0",
    "pypinyin>=0.55.0",
    "tomli-w>=1.2.0",
    "wtforms>=3.2.2",
    "aiosqlite>=0.22.1",
    "rjieba>=0.2.1",
    "scikit-learn>=1.9.0",
    "selectolax>=0.4.11",
    "networkx>=3.6.1",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true


[tool.djangofmt]
line-length = 120
indent-width = 2
# 关键：告诉它我们用的是 Jinja2 语法
profile = "jinja"
# 保持你自闭合标签的习惯，不强加斜杠
html-void-self-closing = "never"
