[project]
name = "litecms"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "alibabacloud-oss-v2>=1.3.2",
    "argon2-cffi>=25.1.0",
    "jinja2-fragments>=1.12.0",
    "litestar-debug-toolbar>=0.4.2",
    "litestar[jinja,sqlalchemy,standard]>=2.24.0",
    "psutil>=7.2.2",
    "pillow>=11.0.0",
    "pypinyin>=0.55.0",
    "tomli-w>=1.2.0",
    "wtforms>=3.2.2",
    "aiosqlite>=0.22.1",
    "rjieba>=0.2.1",
    "selectolax>=0.4.11",
    "nh3>=0.3.6",
    "granian>=2.8.1",
    "structlog>=26.1.0",
    "cryptography>=50.0.0",
]

[[tool.uv.index]]
url = "https://mirror.nju.edu.cn/pypi/web/simple"
default = true


[tool.djangofmt]
line-length = 120
indent-width = 2
# 关键：告诉它我们用的是 Jinja2 语法
profile = "jinja"
# 保持你自闭合标签的习惯，不强加斜杠
html-void-self-closing = "never"

[dependency-groups]
dev = [
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "B",  # flake8-bugbear
    "SIM",# flake8-simplify
    "A",  # flake8-builtins
    "C4", # flake8-comprehensions
    "PIE",# flake8-pie
    "PT", # flake8-pytest-style
]
# RUF012(可变类属性需 ClassVar)与 Litestar/SQLAlchemy 基类类型标注
# (实例变量)冲突:加 ClassVar 会触发 pyright reportIncompatibleVariableOverride。
# 本项目这些类属性均为有意的框架配置, 忽略该规则。
ignore = ["RUF012"]
